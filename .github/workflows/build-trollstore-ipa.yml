name: Build SFI IPA (TrollStore / ad-hoc)

# 为 Reukix/Singbox-re 构建可在 TrollStore / 越狱环境安装的 IPA。
# 特点：不需要 Apple 开发者账号，不需要 .p12 证书，不需要 .mobileprovision 描述文件。
# 使用方式与产出见 README.md。

on:
  workflow_dispatch:
    inputs:
      build_core:
        description: '从源码构建 MITM 版 Libbox.xcframework（首次必须开启，耗时约 20-50 分钟）'
        type: boolean
        default: true
      xcode_version:
        description: 'Xcode 版本，例如 16.2；留空则使用 runner 镜像默认版本'
        required: false
        default: ''
      marketing_version:
        description: 'App 版本号 (CFBundleShortVersionString)'
        required: false
        default: '1.15.0'
      build_version:
        description: 'Build 号 (CFBundleVersion)'
        required: false
        default: '11'
      add_get_task_allow:
        description: '额外注入 get-task-allow（便于调试器附加，一般不需要）'
        type: boolean
        default: false

jobs:
  build:
    name: Build + ad-hoc sign + package IPA
    runs-on: macos-15
    timeout-minutes: 300

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        if: ${{ inputs.xcode_version != '' }}
        run: |
          sudo xcode-select -s "/Applications/Xcode_${{ inputs.xcode_version }}.app/Contents/Developer"
          sudo xcodebuild -license accept || true
          xcodebuild -version

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          echo "DEVELOPER_DIR=$(xcode-select -p)"

      # ---------- 1. 构建 MITM 版 sing-box 内核（Go -> Libbox.xcframework） ----------
      - name: Setup Go
        if: ${{ inputs.build_core }}
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Install gomobile (sagernet fork v0.1.5)
        if: ${{ inputs.build_core }}
        run: |
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.5
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.5
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build MITM Libbox.xcframework
        if: ${{ inputs.build_core }}
        run: |
          chmod +x Scripts/build-mitm-libbox.sh
          ./Scripts/build-mitm-libbox.sh

      - name: Sanity check Libbox
        run: |
          test -d Libbox.xcframework || { echo "::error::Libbox.xcframework 不存在，请先开启 build_core"; exit 1; }
          du -sh Libbox.xcframework

      # ---------- 2. 编译 App（关闭 Xcode 自动签名） ----------
      - name: Build unsigned app
        run: |
          set -euo pipefail
          xcodebuild \
            -project sing-box.xcodeproj \
            -scheme SFI \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData-trollstore \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            MARKETING_VERSION='${{ inputs.marketing_version }}' \
            CURRENT_PROJECT_VERSION='${{ inputs.build_version }}' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY='' \
            build

      # ---------- 3. ad-hoc 自签（保留 entitlements）+ 打包 IPA ----------
      - name: Ad-hoc sign and package IPA
        run: |
          set -euo pipefail
          PROJECT="$GITHUB_WORKSPACE"
          APP="$(find build/DerivedData-trollstore/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          if [[ -z "$APP" || ! -d "$APP" ]]; then
            echo "::error::未找到构建产物 .app"
            exit 1
          fi
          echo "App: $APP"

          IPA_NAME="sing-box-${{ inputs.marketing_version }}-mitm-trollstore.ipa"
          OUTPUT_IPA="$PROJECT/$IPA_NAME"
          WORK="$(mktemp -d)"
          trap 'rm -rf "$WORK"' EXIT

          # --- 3.1 收集源码里的 entitlements 文件 ---
          mapfile -t ENTS < <(find "$PROJECT" -name '*.entitlements' \
              -not -path '*/build/*' -not -path "$PROJECT/Core/*" | sort)
          echo "找到 entitlements 文件:"; printf '  %s\n' "${ENTS[@]}"

          ne_ent=""; app_ent=""
          for f in "${ENTS[@]}"; do
            base="$(basename "$f")"
            if [[ "$base" == "SFI.entitlements" || "$base" == "sing-box.entitlements" ]]; then
              app_ent="$f"
            fi
            if grep -q 'networkextension' "$f" 2>/dev/null && [[ -z "$ne_ent" ]]; then
              ne_ent="$f"
            fi
          done
          if [[ -z "$app_ent" ]]; then
            for f in "${ENTS[@]}"; do
              if ! grep -q 'networkextension' "$f" 2>/dev/null; then app_ent="$f"; break; fi
            done
          fi

          # --- 3.2 兜底：动态生成 entitlements ---
          group_id="$(/usr/libexec/PlistBuddy -c 'Print :AppGroupIdentifier' "$APP/Info.plist" 2>/dev/null || true)"
          echo "App Group: ${group_id:-<未声明>}"

          if [[ -z "$ne_ent" ]]; then
            ne_ent="$WORK/ne.entitlements"
            cat > "$ne_ent" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>com.apple.developer.networking.networkextension</key>
            <array><string>packet-tunnel-provider</string></array>
            <key>com.apple.security.application-groups</key>
            <array><string>${group_id}</string></array>
          </dict></plist>
          EOF
            echo "已生成兜底 NE entitlements"
          fi

          if [[ -z "$app_ent" ]]; then
            app_ent="$WORK/app.entitlements"
            cat > "$app_ent" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>com.apple.security.application-groups</key>
            <array><string>${group_id}</string></array>
          </dict></plist>
          EOF
            echo "已生成兜底 App entitlements"
          fi

          # 可选：注入 get-task-allow
          if [[ "${{ inputs.add_get_task_allow }}" == "true" ]]; then
            for f in "$app_ent" "$ne_ent"; do
              /usr/libexec/PlistBuddy -c 'Add :get-task-allow bool true' "$f" 2>/dev/null \
                || /usr/libexec/PlistBuddy -c 'Set :get-task-allow true' "$f"
            done
          fi

          echo "主 App entitlements: $app_ent"
          echo "NE 扩展 entitlements: $ne_ent"

          # --- 3.3 由内向外 ad-hoc 签名 ---
          sign() {
            local target="$1" ent="$2"
            codesign --force --sign - --timestamp=none \
                     --generate-entitlement-der \
                     --entitlements "$ent" "$target"
            echo "  signed: $target"
          }

          while IFS= read -r item; do
            case "$item" in
              *.appex)
                name="$(basename "$item" .appex)"
                match=""
                for f in "${ENTS[@]}"; do
                  [[ "$(basename "$f" .entitlements)" == "$name" ]] && match="$f"
                done
                if [[ -z "$match" ]]; then
                  if [[ "$name" == *Tunnel* ]]; then match="$ne_ent"; else match="$app_ent"; fi
                fi
                sign "$item" "$match"
                ;;
              *.framework|*.dylib)
                # 通用库无需 entitlements
                codesign --force --sign - --timestamp=none "$item"
                echo "  signed (no ent): $item"
                ;;
            esac
          done < <(find "$APP" -depth \( -name '*.appex' -o -name '*.framework' -o -name '*.dylib' \) -print)

          sign "$APP" "$app_ent"

          echo "--- 签名校验 ---"
          codesign --verify --deep --strict --verbose=2 "$APP" || echo "::warning::严格校验有告警，TrollStore 会重新签名，通常不影响安装"

          # --- 3.4 打包 IPA ---
          rm -f "$OUTPUT_IPA"
          (
            cd "$WORK"
            mkdir Payload
            cp -R "$APP" Payload/
            find Payload -name '._*' -delete
            find Payload -name '.DS_Store' -delete
            zip -qry "$OUTPUT_IPA" Payload
          )
          echo "IPA: $OUTPUT_IPA"
          ls -lh "$OUTPUT_IPA"
          echo "ipa_path=$OUTPUT_IPA" >> "$GITHUB_OUTPUT"
        id: package

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-mitm-trollstore-ipa
          path: ./*.ipa
          compression-level: 0
          retention-days: 90

      - name: Summary
        run: |
          {
            echo "### sing-box MITM IPA (TrollStore)"
            echo ""
            echo "- 版本: ${{ inputs.marketing_version }} (${{ inputs.build_version }})"
            echo "- 签名: ad-hoc（无证书/无描述文件），TrollStore 安装时会重新签名"
            echo "- 请在 Artifacts 中下载 \`sing-box-mitm-trollstore-ipa\`"
          } >> "$GITHUB_STEP_SUMMARY"

