name: Build SFI IPA TrollStore

# 为 Reukix/Singbox-re 构建可在 TrollStore / 越狱环境安装的 IPA。
# 不需要 Apple 开发者账号，不需要 .p12 证书，不需要 .mobileprovision 描述文件。
 
on:
 # 支持手动触发（Actions 页面点 Run workflow）
  workflow_dispatch:
    inputs:
      build_core:
        description: "从源码构建 MITM 版 Libbox.xcframework（必须开启，耗时约 20-50 分钟）"
        type: boolean
        default: true
      xcode_version:
        description: "Xcode 版本，如 16.2；留空用 runner 默认"
        type: string
        default: ""
      marketing_version:
        description: "App 版本号"
        type: string
        default: "1.15.0"
      build_version:
        description: "Build 号"
        type: string
        default: "11"
      add_get_task_allow:
        description: "额外注入 get-task-allow（一般不需要）"
        type: boolean
        default: false
 # 推送到 main 分支且改动了本工作流时自动触发
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-trollstore-ipa.yml"

jobs:
  build:
    name: Build and package IPA
    runs-on: macos-15
    timeout-minutes: 300

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Init submodules manually if needed
        run: |
          git submodule sync --recursive || true
          git submodule update --init --recursive || true
          echo "--- submodule status ---"
          git submodule status --recursive || true
          echo "--- Core/sing-box ---"
          ls -la Core/sing-box 2>/dev/null | head -20 || echo "Core/sing-box 不存在"

      - name: Select Xcode
        if: inputs.xcode_version != ''
        run: |
          sudo xcode-select -s "/Applications/Xcode_${{ inputs.xcode_version }}.app/Contents/Developer"
          sudo xcodebuild -license accept || true
          xcodebuild -version

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          echo "DEVELOPER_DIR=$(xcode-select -p)"
          echo "workspace=$GITHUB_WORKSPACE"

      - name: Setup Go
        if: inputs.build_core
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false

      - name: Install gomobile
        if: inputs.build_core
        run: |
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.5
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.5
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build MITM Libbox
        if: inputs.build_core
        run: |
          chmod +x Scripts/build-mitm-libbox.sh
          ./Scripts/build-mitm-libbox.sh

      - name: Check Libbox
        run: |
          if [ ! -d Libbox.xcframework ]; then
            echo "::error::Libbox.xcframework not found"
            exit 1
          fi
          du -sh Libbox.xcframework

      - name: Build unsigned app
        run: |
          set -euo pipefail
          xcodebuild \
            -project sing-box.xcodeproj \
            -scheme SFI \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData-trollstore \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            MARKETING_VERSION="${{ inputs.marketing_version || '1.15.0' }}" \
            CURRENT_PROJECT_VERSION="${{ inputs.build_version || '11' }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Ad-hoc sign and package IPA
        run: |
          set -euo pipefail
          PROJECT="$GITHUB_WORKSPACE"
          APP="$(find build/DerivedData-trollstore/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$APP" ] || [ ! -d "$APP" ]; then
            echo "::error::built .app not found"
            exit 1
          fi
          echo "app: $APP"

          VER="${{ inputs.marketing_version || '1.15.0' }}"
          IPA_NAME="sing-box-${VER}-mitm-trollstore.ipa"
          OUTPUT_IPA="$PROJECT/$IPA_NAME"
          WORK="$(mktemp -d)"

          # 收集源码中的 entitlements
          ENTS="$(find "$PROJECT" -name '*.entitlements' -not -path '*/build/*' -not -path "$PROJECT/Core/*" | sort || true)"
          echo "entitlements files:"
          echo "$ENTS"

          NE_ENT=""
          APP_ENT=""
          for f in $ENTS; do
            b="$(basename "$f")"
            if [ "$b" = "SFI.entitlements" ] || [ "$b" = "sing-box.entitlements" ]; then
              APP_ENT="$f"
            fi
            if [ -z "$NE_ENT" ] && grep -q 'networkextension' "$f" 2>/dev/null; then
              NE_ENT="$f"
            fi
          done
          if [ -z "$APP_ENT" ]; then
            for f in $ENTS; do
              if ! grep -q 'networkextension' "$f" 2>/dev/null; then APP_ENT="$f"; break; fi
            done
          fi

          GROUP_ID="$(/usr/libexec/PlistBuddy -c 'Print :AppGroupIdentifier' "$APP/Info.plist" 2>/dev/null || true)"
          echo "AppGroupIdentifier: ${GROUP_ID:-none}"

          # 写出最终 entitlements
          FINAL_NE="$WORK/ne.entitlements"
          FINAL_APP="$WORK/app.entitlements"
          if [ -n "$NE_ENT" ]; then FINAL_NE="$NE_ENT"; else
            printf '%s\n' \
              '<?xml version="1.0" encoding="UTF-8"?>' \
              '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
              '<plist version="1.0"><dict>' \
              '  <key>com.apple.developer.networking.networkextension</key>' \
              '  <array><string>packet-tunnel-provider</string></array>' \
              "  <key>com.apple.security.application-groups</key><array><string>${GROUP_ID}</string></array>" \
              '</dict></plist>' > "$FINAL_NE"
          fi
          if [ -n "$APP_ENT" ]; then FINAL_APP="$APP_ENT"; else
            printf '%s\n' \
              '<?xml version="1.0" encoding="UTF-8"?>' \
              '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
              '<plist version="1.0"><dict>' \
              "  <key>com.apple.security.application-groups</key><array><string>${GROUP_ID}</string></array>" \
              '</dict></plist>' > "$FINAL_APP"
          fi

          if [ "${{ inputs.add_get_task_allow }}" = "true" ]; then
            for f in "$FINAL_APP" "$FINAL_NE"; do
              /usr/libexec/PlistBuddy -c 'Add :get-task-allow bool true' "$f" 2>/dev/null || \
              /usr/libexec/PlistBuddy -c 'Set :get-task-allow true' "$f" || true
            done
          fi

          echo "app entitlements: $FINAL_APP"
          echo "ne  entitlements: $FINAL_NE"

          # 由内向外 ad-hoc 签名
          find "$APP" -depth \( -name '*.framework' -o -name '*.dylib' \) -print | while read -r item; do
            codesign --force --sign - --timestamp=none "$item" && echo "signed lib: $item"
          done

          find "$APP" -depth -name '*.appex' -print | while read -r item; do
            name="$(basename "$item" .appex)"
            match="$FINAL_APP"
            for f in $ENTS; do
              if [ "$(basename "$f" .entitlements)" = "$name" ]; then match="$f"; fi
            done
            case "$name" in
              *Tunnel*) [ -n "$NE_ENT" ] && match="$NE_ENT" ;;
            esac
            codesign --force --sign - --timestamp=none --generate-entitlement-der \
                     --entitlements "$match" "$item" && echo "signed appex: $item <- $match"
          done

          codesign --force --sign - --timestamp=none --generate-entitlement-der \
                   --entitlements "$FINAL_APP" "$APP"

          echo "--- verify ---"
          codesign --verify --deep --strict --verbose=2 "$APP" 2>&1 | tail -5 || \
            echo "::warning::strict verify warnings (normal, TrollStore re-signs)"

          rm -f "$OUTPUT_IPA"
          cd "$WORK"
          mkdir Payload
          cp -R "$APP" Payload/
          find Payload -name '._*' -delete
          find Payload -name '.DS_Store' -delete
          zip -qry "$OUTPUT_IPA" Payload
          echo "IPA: $OUTPUT_IPA"
          ls -lh "$OUTPUT_IPA"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-mitm-trollstore-ipa
          path: ./*.ipa
          compression-level: 0
          retention-days: 90
