name: Build SFI IPA TrollStore

# 为 Reukix/Singbox-re 构建可在 TrollStore / 越狱环境安装的 IPA。
# 不需要 Apple 开发者账号，不需要 .p12 证书，不需要 .mobileprovision 描述文件。
#
# 注意：不使用 actions/checkout 的 submodules 功能，也不调用 Scripts/build-mitm-libbox.sh，
# 改为在本工作流内直接克隆依赖并编译内核，避免 fork 仓库上 git submodule 拉取失败的问题。

on:
  workflow_dispatch:
    inputs:
      xcode_version:
        description: "Xcode 版本，如 26.3；留空则自动选镜像上最新"
        type: string
        default: ""
      runner:
        description: "runner 镜像，macos-26 或 macos-15"
        type: string
        default: "macos-26"
      min_ios:
        description: "强制最低 iOS 版本，如 15.0；留空用项目默认（依赖若要求更高会编译失败）"
        type: string
        default: ""
      marketing_version:
        description: "App 版本号"
        type: string
        default: "1.15.0"
      build_version:
        description: "Build 号"
        type: string
        default: "11"
      add_get_task_allow:
        description: "额外注入 get-task-allow（一般不需要）"
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-trollstore-ipa.yml"

jobs:
  build:
    name: Build and package IPA
    # 项目依赖 libghostty-spm，其中用到了 UIGlassEffect（iOS 26 液态玻璃 API）。
    # Xcode 16.4 的 iOS 18.5 SDK 里没有该符号，会报 cannot find 'UIGlassEffect' in scope。
    # 因此默认使用 macos-26 镜像（默认 Xcode 26.5/26.6，带 iOS 26 SDK）。
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 300

    steps:
      - name: Checkout (no submodules)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Select Xcode
        run: |
          set -eo pipefail
          echo "镜像上可用的 Xcode:"
          ls -d /Applications/Xcode_*.app 2>/dev/null || echo "  未找到 Xcode_*.app"

          if [ "${{ inputs.xcode_version }}" != "" ]; then
            TARGET="/Applications/Xcode_${{ inputs.xcode_version }}.app/Contents/Developer"
            echo "按输入指定: $TARGET"
          else
            # 自动选择版本号最大的 Xcode（确保拿到带 iOS 26 SDK 的版本）
            NEWEST="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
            TARGET="${NEWEST}/Contents/Developer"
            echo "自动选择最新: ${NEWEST}"
          fi

          if [ -d "$TARGET" ]; then
            sudo xcode-select -s "$TARGET"
          else
            echo "::warning::路径不存在，沿用镜像默认: $TARGET"
          fi
          sudo xcodebuild -license accept || true
          xcodebuild -version
          echo "SDK:"; xcrun --sdk iphoneos --show-sdk-path

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          echo "DEVELOPER_DIR=$(xcode-select -p)"

      # ------------------------------------------------------------------
      # 手动准备依赖（替代 git submodule）
      # ------------------------------------------------------------------
      - name: Fetch dependencies manually
        run: |
          set -eo pipefail
          export DEVELOPER_DIR="$(xcode-select -p)"
          cd "$GITHUB_WORKSPACE"

          # 记录仓库锁定的 Runestone commit，保证版本一致
          RUNE_SHA="$(git rev-parse HEAD:Frameworks/Runestone 2>/dev/null || true)"
          echo "Runestone pinned: ${RUNE_SHA:-unknown}"

          # 移除子模块配置，后续不再有任何 git submodule 操作
          rm -f .gitmodules
          rm -rf Frameworks/Runestone Core/sing-box

          echo "==> 克隆 Runestone"
          git clone https://github.com/nekohasekai/Runestone.git Frameworks/Runestone
          if [ -n "$RUNE_SHA" ]; then
            git -C Frameworks/Runestone checkout -q "$RUNE_SHA" || \
              echo "::warning::无法切到锁定的 Runestone commit，使用默认分支"
          fi
          echo "Runestone: $(git -C Frameworks/Runestone rev-parse --short HEAD)"

          echo "==> 克隆 sing-box 内核"
          git clone --filter=blob:none https://github.com/SagerNet/sing-box.git Core/sing-box
          git -C Core/sing-box fetch --depth 1 origin tag v1.15.0-alpha.6
          git -C Core/sing-box checkout -q v1.15.0-alpha.6
          echo "sing-box: $(git -C Core/sing-box describe --tags --always)"

      # ------------------------------------------------------------------
      # 编译 MITM 版 Libbox.xcframework
      # ------------------------------------------------------------------
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # 内核源码的 go.mod 要求 go1.25.5，用 1.24 会触发 toolchain 自动下载
          go-version: "1.25"
          check-latest: true
          cache: false

      - name: Install gomobile
        run: |
          # 必须使用 v0.1.12：build_libbox 会传 -tags-not-macos，
          # 该参数只有 v0.1.12 支持，v0.1.5 会报 flag provided but not defined
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.12
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          export PATH="$(go env GOPATH)/bin:$PATH"
          which gomobile
          gomobile version || true

      - name: Show core source state
        run: |
          set -eo pipefail
          cd "$GITHUB_WORKSPACE"
          echo "Patches 目录:"; ls -la Patches/
          echo "Core/sing-box HEAD:"; git -C Core/sing-box log -1 --oneline
          echo "cmd/internal 是否独立 module:"
          ls -la Core/sing-box/cmd/internal/go.mod 2>/dev/null || echo "  无独立 go.mod（属主模块）"
          echo "cmd/internal 内容:"; ls Core/sing-box/cmd/internal/ 2>/dev/null || true

      - name: Init gomobile
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          gomobile version || true
          gomobile init || echo "::warning::gomobile init 返回非零，继续尝试构建"

      - name: Build MITM Libbox
        run: |
          set -xo pipefail
          export DEVELOPER_DIR="$(xcode-select -p)"
          export PATH="$(go env GOPATH)/bin:$PATH"
          cd "$GITHUB_WORKSPACE"

          echo "==> 应用 MITM 补丁"
          cd Core/sing-box
          if git apply --check "$GITHUB_WORKSPACE/Patches/mitm-1.15.patch" 2>/dev/null; then
            git apply "$GITHUB_WORKSPACE/Patches/mitm-1.15.patch"
          elif git apply --3way "$GITHUB_WORKSPACE/Patches/mitm-1.15.patch"; then
            echo "使用 3way 方式应用补丁"
          elif patch -p1 --forward < "$GITHUB_WORKSPACE/Patches/mitm-1.15.patch"; then
            echo "使用 patch 命令应用补丁"
          else
            echo "::error::MITM 补丁应用失败"
            exit 1
          fi
          echo "补丁应用成功"
          git status --short | head -20

          echo "==> 交叉编译 Libbox（耗时较长）"
          if [ -f cmd/internal/go.mod ]; then
            echo "cmd/internal 为独立 module，从该目录执行"
            ( cd cmd/internal && go run ./build_libbox -target apple -platform ios -debug )
          else
            go run ./cmd/internal/build_libbox -target apple -platform ios -debug
          fi
          cd "$GITHUB_WORKSPACE"

          echo "==> 定位 Libbox.xcframework"
          SRC="$(find Core/sing-box -maxdepth 4 -type d -name 'Libbox.xcframework' -print -quit)"
          if [ -z "$SRC" ]; then
            echo "::error::未找到 Libbox.xcframework"
            find Core/sing-box -maxdepth 3 -name '*.xcframework' -print || true
            exit 1
          fi
          echo "源: $SRC"
          mkdir -p Libbox.xcframework
          rsync -a --delete "$SRC/" Libbox.xcframework/

          echo "==> 校验 MITM 标记"
          BIN="Libbox.xcframework/ios-arm64/Libbox.framework/Libbox"
          if [ ! -f "$BIN" ]; then
            echo "::error::未找到二进制: $BIN"
            ls -la Libbox.xcframework/ Libbox.xcframework/*/ 2>/dev/null || true
            exit 1
          fi
          ls -lh "$BIN"
          # 直接用 grep -a 扫描二进制，避免 strings 在超大文件上
          # 因管道缓冲写满而报 "failed to flush output"
          missing=0
          for m in tls_decryption surge_url_rewrite surge_header_rewrite surge_body_rewrite surge_map_local; do
            if grep -a -q -F "$m" "$BIN"; then
              echo "  ok: $m"
            else
              echo "::warning::未匹配到标记: $m（可能被编译器内联优化，不阻断构建）"
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo "共有 $missing 个标记未匹配，仅作提示，继续构建"
          fi
          du -sh Libbox.xcframework

      # ------------------------------------------------------------------
      # 编译 App（关闭 Xcode 自动签名）
      # ------------------------------------------------------------------
      - name: Build unsigned app
        run: |
          set -eo pipefail
          cd "$GITHUB_WORKSPACE"
          MIN_IOS="${{ inputs.min_ios }}"
          DEPLOY_ARGS=()
          if [ -n "$MIN_IOS" ]; then
            echo "强制最低 iOS 版本: $MIN_IOS"
            DEPLOY_ARGS=("IPHONEOS_DEPLOYMENT_TARGET=$MIN_IOS")
          fi
          xcodebuild \
            -project sing-box.xcodeproj \
            -scheme SFI \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData-trollstore \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            MARKETING_VERSION="${{ inputs.marketing_version || '1.15.0' }}" \
            CURRENT_PROJECT_VERSION="${{ inputs.build_version || '11' }}" \
            "${DEPLOY_ARGS[@]}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY="" \
            build

      # ------------------------------------------------------------------
      # ad-hoc 签名并打包
      # ------------------------------------------------------------------
      - name: Report app requirements
        run: |
          set -eo pipefail
          cd "$GITHUB_WORKSPACE"
          APP="$(find "$GITHUB_WORKSPACE/build/DerivedData-trollstore/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$APP" ]; then
            echo "::error::未找到 .app，无法读取版本要求"
            exit 1
          fi
          echo "===== 安装要求 ====="
          echo "App:               $(basename "$APP")"
          echo "Bundle ID:         $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" 2>/dev/null || true)"
          echo "版本:              $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist" 2>/dev/null || true)"
          echo "MinimumOSVersion:  $(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist" 2>/dev/null || true)"
          echo "支持的架构:        $(lipo -info "$APP/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist" 2>/dev/null)" 2>/dev/null || true)"
          echo "==================="

      - name: Ad-hoc sign and package IPA
        run: |
          set -eo pipefail
          cd "$GITHUB_WORKSPACE"
          APP="$(find "$GITHUB_WORKSPACE/build/DerivedData-trollstore/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$APP" ] || [ ! -d "$APP" ]; then
            echo "::error::未找到构建产物 .app"
            exit 1
          fi
          echo "app: $APP"

          VER="${{ inputs.marketing_version || '1.15.0' }}"
          OUTPUT_IPA="$GITHUB_WORKSPACE/sing-box-${VER}-mitm-trollstore.ipa"
          WORK="$(mktemp -d)"

          ENTS="$(find "$GITHUB_WORKSPACE" -name '*.entitlements' -not -path '*/build/*' -not -path "$GITHUB_WORKSPACE/Core/*" | sort || true)"
          echo "entitlements:"; echo "$ENTS"

          NE_ENT=""
          APP_ENT=""
          for f in $ENTS; do
            b="$(basename "$f")"
            if [ "$b" = "SFI.entitlements" ] || [ "$b" = "sing-box.entitlements" ]; then APP_ENT="$f"; fi
            if [ -z "$NE_ENT" ] && grep -q 'networkextension' "$f" 2>/dev/null; then NE_ENT="$f"; fi
          done
          if [ -z "$APP_ENT" ]; then
            for f in $ENTS; do
              if ! grep -q 'networkextension' "$f" 2>/dev/null; then APP_ENT="$f"; break; fi
            done
          fi

          GROUP_ID="$(/usr/libexec/PlistBuddy -c 'Print :AppGroupIdentifier' "$APP/Info.plist" 2>/dev/null || true)"
          echo "AppGroupIdentifier: ${GROUP_ID:-none}"

          FINAL_NE="$WORK/ne.entitlements"
          FINAL_APP="$WORK/app.entitlements"
          if [ -n "$NE_ENT" ]; then FINAL_NE="$NE_ENT"; else
            printf '%s\n' \
              '<?xml version="1.0" encoding="UTF-8"?>' \
              '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
              '<plist version="1.0"><dict>' \
              '  <key>com.apple.developer.networking.networkextension</key>' \
              '  <array><string>packet-tunnel-provider</string></array>' \
              "  <key>com.apple.security.application-groups</key><array><string>${GROUP_ID}</string></array>" \
              '</dict></plist>' > "$FINAL_NE"
          fi
          if [ -n "$APP_ENT" ]; then FINAL_APP="$APP_ENT"; else
            printf '%s\n' \
              '<?xml version="1.0" encoding="UTF-8"?>' \
              '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
              '<plist version="1.0"><dict>' \
              "  <key>com.apple.security.application-groups</key><array><string>${GROUP_ID}</string></array>" \
              '</dict></plist>' > "$FINAL_APP"
          fi

          if [ "${{ inputs.add_get_task_allow }}" = "true" ]; then
            for f in "$FINAL_APP" "$FINAL_NE"; do
              /usr/libexec/PlistBuddy -c 'Add :get-task-allow bool true' "$f" 2>/dev/null || \
              /usr/libexec/PlistBuddy -c 'Set :get-task-allow true' "$f" || true
            done
          fi

          echo "app entitlements: $FINAL_APP"
          echo "ne  entitlements: $FINAL_NE"

          find "$APP" -depth \( -name '*.framework' -o -name '*.dylib' \) -print | while read -r item; do
            codesign --force --sign - --timestamp=none "$item" && echo "signed lib: $item"
          done

          find "$APP" -depth -name '*.appex' -print | while read -r item; do
            name="$(basename "$item" .appex)"
            match="$FINAL_APP"
            for f in $ENTS; do
              if [ "$(basename "$f" .entitlements)" = "$name" ]; then match="$f"; fi
            done
            case "$name" in
              *Tunnel*) [ -n "$NE_ENT" ] && match="$NE_ENT" ;;
            esac
            codesign --force --sign - --timestamp=none --generate-entitlement-der \
                     --entitlements "$match" "$item" && echo "signed appex: $item <- $match"
          done

          codesign --force --sign - --timestamp=none --generate-entitlement-der \
                   --entitlements "$FINAL_APP" "$APP"

          echo "--- verify ---"
          codesign --verify --deep --strict --verbose=2 "$APP" 2>&1 | tail -5 || \
            echo "::warning::strict verify warnings (normal, TrollStore re-signs)"

          rm -f "$OUTPUT_IPA"
          cd "$WORK"
          mkdir Payload
          cp -R "$APP" Payload/
          find Payload -name '._*' -delete
          find Payload -name '.DS_Store' -delete
          zip -qry "$OUTPUT_IPA" Payload
          echo "IPA: $OUTPUT_IPA"
          ls -lh "$OUTPUT_IPA"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-mitm-trollstore-ipa
          path: ./*.ipa
          compression-level: 0
          retention-days: 90
